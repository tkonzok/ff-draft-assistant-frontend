<div class="filters-wrapper">
  <div class="filter-buttons">
    <button (click)="showAll()" class="black-background">CLEAR</button>
    <button
      (click)="togglePosition(Position.QB)"
      [ngClass]="{
        'qb-background': visiblePosition === Position.QB,
      }"
      >
      {{ Position.QB }}
    </button>
    <button
      (click)="togglePosition(Position.RB)"
      [ngClass]="{
        'rb-background': visiblePosition === Position.RB,
      }"
      >
      {{ Position.RB }}
    </button>
    <button
      (click)="togglePosition(Position.WR)"
      [ngClass]="{
        'wr-background': visiblePosition === Position.WR,
      }"
      >
      {{ Position.WR }}
    </button>
    <button
      (click)="togglePosition(Position.TE)"
      [ngClass]="{
        'te-background': visiblePosition === Position.TE,
      }"
      >
      {{ Position.TE }}
    </button>
    <button
      (click)="togglePosition(Position.PICK)"
      [ngClass]="{
        'pick-background': visiblePosition === Position.PICK,
      }"
      >
      {{ Position.PICK }}
    </button>
    <button
      (click)="toggleTierView()"
      [ngClass]="{
        'red-background': showOnlyNextTiers,
      }"
      >
      TIER
    </button>
  </div>
  <div class="filter-buttons">
    <div class="search-bar-wrapper">
      <div class="search-container">
        <input
          type="text"
          [(ngModel)]="searchTerm"
          placeholder="Search players..."
          (input)="filterPlayers()"
          class="search-input"
          />
        @if (searchTerm) {
          <button (click)="clearSearch()" class="clear-btn">×</button>
        }
      </div>
      <span>{{ currentPick }}</span>
    </div>
    <button [routerLink]="'/rankings'">EDIT</button>
  </div>
</div>

<div class="draft-board-grid">
  <div class="grid-header">
    <div></div>
    <div>OVR</div>
    <div>POS</div>
    <div>RANK</div>
    <div>NAME</div>
    <div>TEAM</div>
    <div>BYE</div>
    <div></div>
  </div>

  <div class="grid-row-wrapper">
    @for (player of filteredPlayers; track player) {
      <div class="grid-row">
        <app-draft-board-row
          [player]="player"
          [showBorderBottom]="visiblePosition !== undefined && player.rankings[this.settings].isLastOfTier"
        [ngClass]="{
          highlighted: highlightedPlayers.includes(player) && !showOnlyNextTiers,
        }"
          >
        </app-draft-board-row>
      </div>
    }
  </div>
</div>
