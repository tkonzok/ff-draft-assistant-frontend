<div class="modal-backdrop"></div>
<div class="modal">
  @if (name) {
    <p>Are you sure you want to delete {{ name }}?</p>
  }
  @if (!name) {
    <p>Are you sure you want to delete?</p>
  }
  <div class="buttons-wrapper">
    <button (click)="onConfirm()">Yes</button>
    <button (click)="onCancel()">No</button>
  </div>
</div>
