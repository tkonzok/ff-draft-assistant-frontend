<div class="container">
  <div class="flex column mt-16">
    <div class="settings-wrapper">
      <span class="draft-position-label">Pos: </span>
      <select [value]="draftPosition" (change)="selectDraftPosition($event)" class="select-dropdown">
        @for (position of draftPositions; track position) {
          <option [value]="position">
            {{ position }}
          </option>
        }
      </select>
      <span class="draft-position-label">of </span>
      <span class="draft-position-display">{{ totalDraftPositions }}</span>
      @if (selectedDraft) {
        <button
          class="third-round-reversal"
          [ngClass]="{ active: selectedDraft.thirdRoundReversal }"
          (click)="toggleThirdRoundReversal()"
        >
          3RR
        </button>
      }
      <button class="reload-button" (click)="reload()">Reload</button>
      <button (click)="reset()">Reset</button>
      <button (click)="showModal = true">Delete</button>
    </div>
    <div class="select-wrapper">
      <div class="flex">
        <button (click)="showTeam = !showTeam" class="button-toggle-expansion">></button>
        <button (click)="openSettingsModal()" class="button-new-draft">+</button>
      </div>
      <span>Draft:</span>
      <select [(ngModel)]="selectedDraftId" (ngModelChange)="selectDraft($event)" class="select-dropdown">
        @for (draft of availableDrafts; track draft) {
          <option [value]="draft.id">
            {{ draft.name }}
          </option>
        }
      </select>
      <span>Settings:</span>
      <select [value]="selectedSetting" (change)="selectSetting($event)" class="select-dropdown">
        @for (setting of availableSettings; track setting) {
          <option [value]="setting">
            {{ setting }}
          </option>
        }
      </select>
    </div>
    @if (showTeam) {
      <app-drafted-team></app-drafted-team>
    }
  </div>
  <div>
    <div class="flex last-updated">
      <div class="indicator" [ngClass]="{ green: isUpToDate }"></div>
      <p>{{ (lastUpdated$ | async)?.toLocaleString() }}</p>
      <button (click)="undo()" class="button-undo">Undo</button>
    </div>
    <app-draft-board
      [ngClass]="{ extend: !showTeam }"
      class="mt-16"
      [draftPosition]="draftPosition"
      [totalDraftPositions]="totalDraftPositions"
      [thirdRoundReversal]="!!selectedDraft?.thirdRoundReversal"
    ></app-draft-board>
  </div>
  @if (showModal) {
    <app-confirm-delete-modal [name]="selectedDraft?.name" (confirm)="handleConfirmation($event)"> </app-confirm-delete-modal>
  }
</div>
